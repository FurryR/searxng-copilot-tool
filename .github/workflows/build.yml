name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Compile
        run: pnpm run compile

      - name: Package VSIX
        run: pnpm run package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: searxng-copilot-tool-vsix
          path: "*.vsix"
